<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#71717a"/>
      <stop offset="100%" stop-color="#3f3f46"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="400" height="400" rx="36"/>
    </clipPath>
  </defs>
  <rect width="400" height="400" rx="36" fill="url(#card)"/>

  <g clip-path="url(#frame)">
    <!-- shoulders / torso, flush to bottom edge -->
    <path d="M0 400 L0 322 C90 268 310 268 400 322 L400 400 Z" fill="#0c0c0d"/>

    <!-- neck -->
    <rect x="176" y="252" width="48" height="48" fill="#d4d4d8"/>

    <!-- ears -->
    <circle cx="104" cy="212" r="17" fill="#d4d4d8"/>
    <circle cx="296" cy="212" r="17" fill="#d4d4d8"/>

    <!-- face -->
    <ellipse cx="200" cy="212" rx="100" ry="106" fill="#d4d4d8"/>

    <!-- curly hair mass -->
    <path d="M74 200
             C54 88 128 18 200 18
             C272 18 346 88 326 200
             C326 148 298 136 284 154
             C292 110 252 84 226 98
             C222 70 178 70 174 98
             C148 84 108 110 116 154
             C102 136 74 148 74 200 Z" fill="#0c0c0d"/>
    <circle cx="82" cy="158" r="28" fill="#0c0c0d"/>
    <circle cx="108" cy="102" r="30" fill="#0c0c0d"/>
    <circle cx="152" cy="62" r="30" fill="#0c0c0d"/>
    <circle cx="200" cy="46" r="30" fill="#0c0c0d"/>
    <circle cx="248" cy="62" r="30" fill="#0c0c0d"/>
    <circle cx="292" cy="102" r="30" fill="#0c0c0d"/>
    <circle cx="318" cy="158" r="28" fill="#0c0c0d"/>
    <circle cx="100" cy="196" r="20" fill="#0c0c0d"/>
    <circle cx="300" cy="196" r="20" fill="#0c0c0d"/>

    <!-- raised eyebrow (right) -->
    <path d="M226 176 q22 -14 42 -4" fill="none" stroke="#0c0c0d" stroke-width="7" stroke-linecap="round"/>
    <!-- flat brow (left) -->
    <path d="M132 182 q20 -6 40 0" fill="none" stroke="#0c0c0d" stroke-width="7" stroke-linecap="round"/>

    <!-- eyes, half-lidded -->
    <path d="M140 208 q18 8 36 0" fill="none" stroke="#0c0c0d" stroke-width="7" stroke-linecap="round"/>
    <path d="M224 208 q18 8 36 0" fill="none" stroke="#0c0c0d" stroke-width="7" stroke-linecap="round"/>

    <!-- smirk -->
    <path d="M168 254 q34 18 62 -2" fill="none" stroke="#0c0c0d" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
